<?xml version="1.0"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        title="zotero-TOC : sommaire du document"
        width="760" height="640"
        persist="width height screenX screenY">

  <script src="paste.js"/>

  <vbox flex="1" style="padding: 12px;">
    <description id="ztoc-paste-note"
                 style="max-width: 70em; margin-bottom: 6px; font-weight: bold;"/>

    <description style="max-width: 70em; margin-bottom: 8px; opacity: 0.85;">
      Une ligne par entrée. Le retrait (espaces ou tabulations), les puces,
      les titres Markdown (#, ##) et la numérotation (1, 1.1, 1.1.1) donnent la
      hiérarchie. Les numéros de page sont facultatifs : ils servent d'indice,
      jamais de destination, et le décalage avec les pages du lecteur est
      estimé automatiquement. Chaque intitulé est retrouvé dans le texte, en
      écartant les titres courants répétés en haut de page.
    </description>

    <html:textarea id="ztoc-paste-area" flex="1" rows="20"
                   style="flex: 1; width: 100%; font-family: monospace;
                          font-size: 12px; min-height: 320px;"
                   placeholder="Introduction .......... 1&#10;Partie I : Fondements&#10;    Chapitre 1 : Origines .......... 5&#10;        1.1 Une notion ancienne .......... 7"/>

    <hbox align="center" style="margin-top: 8px;">
      <checkbox id="ztoc-paste-ai"
                label="Solliciter le modèle pour les intitulés introuvables"/>
      <spacer flex="1"/>
      <label id="ztoc-paste-count" style="opacity: 0.75;"/>
    </hbox>

    <hbox pack="end" style="margin-top: 12px;">
      <button id="ztoc-paste-clear" label="Vider"/>
      <spacer flex="1"/>
      <button id="ztoc-paste-cancel" label="Annuler"/>
      <button id="ztoc-paste-ok" label="Retrouver dans le document" default="true"
              style="margin-left: 8px;"/>
    </hbox>
  </vbox>
</window>
